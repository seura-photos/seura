# cargo-deny: licenses, security advisories, and dependency sources.
# Licenses follow decision 0012: no GPL or AGPL; LGPL only for dynamically
# linked libraries, which are not Rust crates and so never appear here.

[graph]
# Only the platforms Seura ships on, so Linux-only dependencies don't count.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained but has no known vulnerability. It's a compile-time
    # macro pulled in by Tauri and specta; revisit when they move off it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro, used by tauri and specta" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # MPL-2.0 is file-level copyleft: compatible with an Apache-2.0 app as long
    # as the MPL files themselves stay available, which crates.io ensures for
    # unmodified crates. Tauri needs it (cssparser, selectors, dtoa-short via
    # tauri-utils; option-ext via dirs). Approved for unmodified crates in decision 0012.
    "MPL-2.0",
]

# jpeg-encoder encodes JPEG exports. Its IJG license is permissive, but not on
# the list above: it asks for credit to the Independent JPEG Group in the
# documentation, which the third-party notices give (M7).
[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

[licenses.private]
# Our own unpublished crates are Apache-2.0; skip checking them against crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
