name: CI

# Changes to documentation alone (specs, plans, decisions, the journal,
# mockups, Markdown anywhere) don't run CI: no build or test reads them. A
# change that also touches anything else runs everything. design/ isn't
# skipped, since the app builds from its tokens and icons.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is macOS 26, with WebGPU in the web view; macOS 15 has
        # only WebGL2, the preview's fallback (technical design, section 12).
        os: [windows-latest, macos-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI packages
        working-directory: ui
        run: npm ci

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Prettier
        working-directory: ui
        run: npm run format:check

      - name: ESLint
        working-directory: ui
        run: npm run lint

      - name: Typecheck and build the UI
        working-directory: ui
        run: npm run build

      - name: UI tests
        working-directory: ui
        run: npm test

      # Fails if the in-memory index misses a target (decision 0010).
      - name: Index benchmarks
        run: cargo bench -p seura-library --bench index --locked

      # Thumbnails a second, with the real workers; fails below PRF-3.
      - name: Thumbnail benchmark
        run: cargo bench -p seura-library --bench thumbnails --locked

      # Builds the app as users get it (an .app bundle on macOS, so WebKit sees
      # the real identifier), runs it, and lists what it wrote (decision 0013).
      - name: Build the app
        working-directory: ui
        run: npm run tauri -- build --debug ${{ runner.os == 'macOS' && '--bundles app' || '--no-bundle' }}

      - name: Audit where the app writes
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/app_data_audit.py 15

      # The preview, in the real web view, against the export renderer, with
      # every preview path the web view has (decision 0004; M1 slice 5).
      - name: Render check
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/render_check.py

  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm licenses
        working-directory: ui
        run: |
          npm ci
          npm run licenses
