name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # An older macOS image joins in slice 5, for the WebGL2 preview path.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI packages
        working-directory: ui
        run: npm ci

      # libheif and libde265 for the Windows HEIC fallback (decision 0011),
      # as DLLs, from vcpkg at the commit pinned in .github/vcpkg-commit.
      # libheif[core] leaves out the x265 encoder, which is GPL.
      - name: Restore the vcpkg binary cache
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ hashFiles('.github/vcpkg-commit') }}-libheif-core-x64-windows

      - name: Build libheif with vcpkg
        if: runner.os == 'Windows'
        shell: bash
        env:
          VCPKG_DISABLE_METRICS: "1"
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-cache,readwrite
        run: |
          root="$RUNNER_TEMP/vcpkg"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          git init -q "$root"
          git -C "$root" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$(cat .github/vcpkg-commit)"
          git -C "$root" checkout -q FETCH_HEAD
          "$root/bootstrap-vcpkg.bat" -disableMetrics
          "$root/vcpkg.exe" install "libheif[core]:x64-windows"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Prettier
        working-directory: ui
        run: npm run format:check

      - name: ESLint
        working-directory: ui
        run: npm run lint

      - name: Typecheck and build the UI
        working-directory: ui
        run: npm run build

      - name: UI tests
        working-directory: ui
        run: npm test

      # Fails if the in-memory index misses a target (decision 0010).
      - name: Index benchmarks
        run: cargo bench -p seura-library --bench index --locked

      # Builds the app as users get it (an .app bundle on macOS, so WebKit sees
      # the real identifier), runs it, and lists what it wrote (decision 0013).
      - name: Build the app
        working-directory: ui
        run: npm run tauri -- build --debug ${{ runner.os == 'macOS' && '--bundles app' || '--no-bundle' }}

      - name: Audit where the app writes
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/app_data_audit.py 15

  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm licenses
        working-directory: ui
        run: |
          npm ci
          npm run licenses
