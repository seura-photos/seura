name: Release

# A numbered pre-release build for the owner's own use (milestone plan,
# "Working within a milestone"): pushing a tag like v0.1.0 builds the
# Windows installer and the macOS disk image, unsigned, and attaches them to
# a draft pre-release for Nevada to look over and publish. M1's Editor isn't
# in release builds. Unsigned, so Windows SmartScreen warns, and on the Mac
# the app is opened the first time with right-click → Open.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI packages
        working-directory: ui
        run: npm ci

      # The tag must name the version being built.
      - name: Check the version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }

      - name: Build the app (release)
        working-directory: ui
        run: npm run tauri -- build

      - uses: actions/upload-artifact@v7
        with:
          name: seura-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Draft the pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: builds
          merge-multiple: true

      - name: Create the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" builds/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --title "Seura Photos ${GITHUB_REF_NAME#v} (pre-release)" \
            --notes "A pre-release for the owner's own use, unsigned. Windows: run the installer; SmartScreen may warn (More info → Run anyway). macOS: open the disk image, drag Seura Photos to Applications, and open it the first time with right-click → Open."
