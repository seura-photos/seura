name: Release

# A numbered early build, public from 0.2 (decision 0016; milestone plan,
# "Working within a milestone"): pushing a tag like v0.1.0 builds the
# Windows installer and the macOS disk image, unsigned, and attaches them to
# a draft pre-release for Nevada to look over and publish. The Editor is
# in release builds from 0.3. Not signed for distribution: Windows SmartScreen warns,
# and the Mac app is only ad-hoc signed (bundle.macOS.signingIdentity "-"): with no
# signature at all, macOS on Apple Silicon calls a downloaded app
# "damaged". The first time, macOS blocks it, and System Settings →
# Privacy & Security → Open Anyway allows it. Signing and notarization
# come with the beta (M7).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI packages
        working-directory: ui
        run: npm ci

      # The tag must name the version being built.
      - name: Check the version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }

      - name: Build the app (release)
        working-directory: ui
        run: npm run tauri -- build

      - uses: actions/upload-artifact@v7
        with:
          name: seura-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Draft the pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: builds
          merge-multiple: true

      # The artifacts keep their folders (nsis/, dmg/), so the files are a
      # level down.
      - name: Create the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" builds/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --title "Seura Photos ${GITHUB_REF_NAME#v} (pre-release)" \
            --notes "An early build of Seura Photos, before the beta: some features are still missing, and there are no automatic updates yet. It never changes your photos. It isn't signed for distribution. Windows: run the installer; SmartScreen may warn (More info → Run anyway). macOS: open the disk image, drag Seura Photos to Applications, and open it. The first time, macOS blocks it because it isn't from an identified developer; then open System Settings → Privacy & Security and choose Open Anyway."
