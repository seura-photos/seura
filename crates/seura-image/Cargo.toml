[package]
name = "seura-image"
description = "Decoding, color management, orientation, thumbnails, and metadata for Seura Photos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
zune-jpeg = { workspace = true }
jpeg-decoder = { workspace = true }
png = { workspace = true }
kamadak-exif = { workspace = true }
moxcms = { workspace = true }
half = { workspace = true }
fast_image_resize = { workspace = true }
webp = { workspace = true }
jpeg-encoder = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { workspace = true, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { workspace = true, features = ["CGImageSource", "objc2-core-graphics"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
