[package]
name = "seura-image"
description = "Decoding, color management, orientation, thumbnails, and metadata for Seura Photos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
zune-jpeg = { workspace = true }
png = { workspace = true }
kamadak-exif = { workspace = true }
moxcms = { workspace = true }
fast_image_resize = { workspace = true }
webp = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Only for generating test images; never part of the app.
jpeg-encoder = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
libheif-rs = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }

[lints]
workspace = true
