[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/seura-edit",
    "crates/seura-image",
    "crates/seura-render",
    "crates/seura-library",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/seura-photos/seura"
authors = ["Nevada Hamaker"]

[workspace.dependencies]
seura-edit = { path = "crates/seura-edit" }
seura-image = { path = "crates/seura-image" }
seura-render = { path = "crates/seura-render" }
seura-library = { path = "crates/seura-library" }

serde = { version = "1.0.228", features = ["derive"] }
# preserve_order keeps object keys in file order, so unknown edit-file
# content is saved back in place (edit format: "Preserving the unknown").
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
# No default features: they include fetching remote schemas over HTTP.
jsonschema = { version = "0.58.5", default-features = false }
tempfile = "3.27.0"
# The index snapshot's encoding. Replaces bincode, which is unmaintained
# (RUSTSEC-2025-0141); see docs/journal/2026-10-18-library.md.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
sha2 = "0.11.0"
zune-jpeg = "0.5.15"
# Thumbnails only: decodes JPEGs at a half, quarter, or eighth of their size.
jpeg-decoder = { version = "0.3.2", default-features = false }
png = "0.18.1"
kamadak-exif = "0.6.1"
moxcms = "0.9.1"
# Half floats: the working-space pixels the preview and export render from.
half = { version = "2.7.1", features = ["bytemuck"] }
# The export renderer (decision 0004): Direct3D 12 on Windows (with its
# software adapter where there's no GPU), Metal on macOS.
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "dx12", "metal", "std"] }
# Translates the WGSL shaders to GLSL ES for the WebGL2 preview; used only by
# the test that generates and checks those files.
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
# Watching library folders for changes (LIB-4). CC0-1.0. The 9.0 line is
# still in release candidates.
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
# Waits for wgpu's few async calls; the export runs on a worker thread.
pollster = "1.0.1"
# Message catalogs in Project Fluent, as in the UI (ACC-5).
fluent-bundle = "0.16.0"
fast_image_resize = "6.1.0"
# Lossy WebP thumbnails need Google's libwebp (BSD-3-Clause, compiled in);
# the pure-Rust encoder is lossless only.
webp = "0.3.1"
rayon = "1.12.0"
# JPEG export (EXP-2), pure Rust; its IJG license needs a credit (deny.toml).
jpeg-encoder = "0.7.1"
# Native folder dialog, from Rust (ACC-4). Not tauri-plugin-dialog: it
# depends on the file-system plugin, which decision 0009 keeps out.
rfd = "0.17.2"
# Show in Explorer or Finder, and open in the default app (BRW-8): its Rust
# functions only. The plugin isn't registered, so the UI gets no new access
# (decision 0009).
tauri-plugin-opener = { version = "=2.7.0", default-features = false }
# Windows only: WIC, for HEIC with Microsoft's extensions (decision 0014),
# and the system thumbnails of cloud-only photos.
windows = "0.62.2"
# macOS only: the process's peak memory, for measuring PRF-7.
libc = "0.2.191"
# macOS only: ImageIO decodes HEIC (decision 0014), and Quick Look makes
# the thumbnails of cloud-only photos.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-quick-look-thumbnailing = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2 = "0.6.5"
block2 = "0.6.2"

tauri = "2.12.1"
tauri-build = "2.7.1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Development builds compile the libraries unoptimized, so CI's builds stay
# quick when its cache misses. Optimizing them locally makes photos open in
# under a second in `cargo tauri dev`: see CLAUDE.md, "Faster development
# builds" (a git-ignored .cargo/config.toml).
