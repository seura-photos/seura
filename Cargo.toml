[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/seura-edit",
    "crates/seura-image",
    "crates/seura-render",
    "crates/seura-library",
    "tests",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/seura-photos/seura"
authors = ["Nevada Hamaker"]

[workspace.dependencies]
seura-edit = { path = "crates/seura-edit" }
seura-image = { path = "crates/seura-image" }
seura-render = { path = "crates/seura-render" }
seura-library = { path = "crates/seura-library" }

serde = { version = "1.0.228", features = ["derive"] }
# preserve_order keeps object keys in file order, so unknown edit-file
# content is saved back in place (edit format: "Preserving the unknown").
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
# No default features: they include fetching remote schemas over HTTP.
jsonschema = { version = "0.58.5", default-features = false }
tempfile = "3.27.0"
sha2 = "0.11.0"

tauri = "2.12.1"
tauri-build = "2.7.1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
