[package]
name = "seura-photos"
description = "Seura Photos: a free, open-source photo organizer and non-destructive editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library's file name distinct from the binary's,
# which Cargo needs on Windows.
name = "seura_photos_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true, features = [] }
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
