[package]
name = "seura-photos"
description = "Seura Photos: a free, open-source photo organizer and non-destructive editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library's file name distinct from the binary's,
# which Cargo needs on Windows.
name = "seura_photos_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true, features = [] }
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
seura-library = { workspace = true }
seura-edit = { workspace = true }
seura-image = { workspace = true }
seura-render = { workspace = true }
time = { workspace = true }
rfd = { workspace = true }
tauri-plugin-opener = { workspace = true }
fluent-bundle = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The system text size (ACC-3), region (ACC-6), and sync folders (SET-1).
windows = { workspace = true, features = [
    "UI_ViewManagement",
    "Win32_Globalization",
    "Win32_Storage_CloudFilters",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Peak memory for the measurement script (getrusage).
libc = { workspace = true }
# The system region (ACC-6).
objc2-core-foundation = { workspace = true, features = ["CFLocale", "CFString"] }

[dev-dependencies]
half = { workspace = true }
jpeg-encoder = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
